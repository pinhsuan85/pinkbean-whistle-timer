<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared 33-Second Timer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --danger: #ef4444;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .timer {
      font-size: clamp(6rem, 28vw, 13rem);
      font-weight: 700;
      line-height: 1;
      margin: 30px 0;
      font-variant-numeric: tabular-nums;
    }

    .status {
      color: var(--muted);
      min-height: 24px;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #052e16;
    }

    button.secondary {
      background: #4b5563;
      color: white;
    }

    button.danger {
      background: var(--danger);
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .share {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: left;
    }

    .share label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .share-row {
      display: flex;
      gap: 10px;
    }

    .share input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      background: #111827;
      color: white;
      font-size: 0.95rem;
    }

    .role {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #111827;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .setup-warning {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      background: #451a03;
      color: #fde68a;
      text-align: left;
    }

    @media (max-width: 520px) {
      .app {
        padding: 20px;
      }

      .share-row {
        flex-direction: column;
      }

      .share-row button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Shared 33-Second Timer</h1>
    <p class="subtitle">Host-controlled, synchronized, and automatically repeating</p>

    <div id="setupWarning" class="setup-warning">
      Firebase is not configured yet. Replace the firebaseConfig values in this HTML file before publishing it.
    </div>

    <div id="timer" class="timer">33</div>
    <div id="status" class="status">Connecting...</div>

    <div id="hostControls" class="controls" hidden>
      <button id="startBtn">Start</button>
      <button id="pauseBtn" class="secondary">Pause</button>
      <button id="resetBtn" class="danger">Reset to 33</button>
    </div>

    <div class="role" id="roleLabel"></div>

    <section class="share">
      <label for="viewerUrl">Viewer link</label>
      <div class="share-row">
        <input id="viewerUrl" type="text" readonly />
        <button id="copyBtn" class="secondary">Copy link</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      onValue,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const TIMER_SECONDS = 33;


// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAEj2izAWzyHoFgFVPauMMtMdYzfyOFgYg",
  authDomain: "pinkbean-27263.firebaseapp.com",
  databaseURL: "https://pinkbean-27263-default-rtdb.firebaseio.com",
  projectId: "pinkbean-27263",
  storageBucket: "pinkbean-27263.firebasestorage.app",
  messagingSenderId: "521748293415",
  appId: "1:521748293415:web:7336ee9f3a0224647aeb02"
};

    const params = new URLSearchParams(window.location.search);
    const HOST_KEY = "Lugia";   // choose any password

const isHost =
    params.get("host") === "1" &&
    params.get("key") === HOST_KEY;

    let roomId = params.get("room");
    if (!roomId) {
      roomId = crypto.randomUUID().replaceAll("-", "").slice(0, 12);
      params.set("room", roomId);
      if (isHost) params.set("host", "1");
      history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
    }

    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("status");
    const roleLabel = document.getElementById("roleLabel");
    const hostControls = document.getElementById("hostControls");
    const viewerUrlEl = document.getElementById("viewerUrl");
    const setupWarning = document.getElementById("setupWarning");

    hostControls.hidden = !isHost;
    roleLabel.textContent = isHost ? "Host mode" : "Viewer mode";

    const viewerUrl = `${location.origin}${location.pathname}?room=${encodeURIComponent(roomId)}`;
    viewerUrlEl.value = viewerUrl;

    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(viewerUrl);
        statusEl.textContent = "Viewer link copied";
      } catch {
        viewerUrlEl.select();
        statusEl.textContent = "Select and copy the link manually";
      }
    });

    const notConfigured = Object.values(firebaseConfig).some(
      value => value.includes("PASTE_YOUR")
    );

    if (notConfigured) {
      setupWarning.style.display = "block";
      statusEl.textContent = "Firebase setup required";
      timerEl.textContent = TIMER_SECONDS;
      throw new Error("Firebase config is missing.");
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const timerRef = ref(db, `rooms/${roomId}`);

    let timerState = {
      running: false,
      startedAt: null,
      pausedRemaining: TIMER_SECONDS
    };

    let renderHandle = null;

    function computeRemaining(state) {
      if (!state.running || !state.startedAt) {
        return Number(state.pausedRemaining ?? TIMER_SECONDS);
      }

      const elapsedSeconds = Math.floor((Date.now() - state.startedAt) / 1000);
      const cyclePosition = elapsedSeconds % TIMER_SECONDS;
      return TIMER_SECONDS - cyclePosition;
    }

    function render() {
      const remaining = computeRemaining(timerState);
      timerEl.textContent = String(remaining).padStart(2, "0");

      if (timerState.running) {
        statusEl.textContent = "Running - automatically repeats every 33 seconds";
      } else {
        statusEl.textContent = remaining === TIMER_SECONDS ? "Ready" : "Paused";
      }

      renderHandle = requestAnimationFrame(render);
    }

    onValue(timerRef, async snapshot => {
      const data = snapshot.val();

      if (!data) {
        if (isHost) {
          await set(timerRef, {
            running: false,
            startedAt: null,
            pausedRemaining: TIMER_SECONDS,
            updatedAt: serverTimestamp()
          });
        }
        return;
      }

      timerState = data;
    });

    if (isHost) {
      document.getElementById("startBtn").addEventListener("click", async () => {
        const remaining = computeRemaining(timerState);
        const offset = TIMER_SECONDS - remaining;

        await set(timerRef, {
          running: true,
          startedAt: Date.now() - offset * 1000,
          pausedRemaining: remaining,
          updatedAt: serverTimestamp()
        });
      });

      document.getElementById("pauseBtn").addEventListener("click", async () => {
        const remaining = computeRemaining(timerState);

        await set(timerRef, {
          running: false,
          startedAt: null,
          pausedRemaining: remaining,
          updatedAt: serverTimestamp()
        });
      });

      document.getElementById("resetBtn").addEventListener("click", async () => {
        await set(timerRef, {
          running: false,
          startedAt: null,
          pausedRemaining: TIMER_SECONDS,
          updatedAt: serverTimestamp()
        });
      });
    }

    render();
  </script>
</body>
</html>
